#- Spartan Tmux ---------------------------------------------------------------
set -g history-limit 250000
set -g status off
set -g mouse on
set -g lock-after-time 0
setw -g alternate-screen on
set -gq utf-8 on
set -g set-clipboard external
set -g extended-keys on # helps with pi
set -g extended-keys-format csi-u # helps with pi
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:RGB" # works for ghostty too!
set -as terminal-features ",alacritty:RGB"
set -sg escape-time 0

unbind C-b
unbind -n M-o
set -g prefix C-s
bind x kill-pane
bind H select-layout even-horizontal
bind J select-layout even-vertical
bind l split-window -h -c "#{pane_current_path}"
bind k split-window -v -c "#{pane_current_path}"

# M-o opens a second pane or switches between panes.
# M-i toggles zoom on the current pane; the other pane keeps running.

bind -n M-o if-shell -F '#{>:#{window_panes},1}' \
    { select-pane -l } \
    { split-window -h -c "#{pane_current_path}" }

bind -n M-i resize-pane -Z

set -g mouse on
set -g pane-border-style fg='colour8'
set -g pane-active-border-style fg='colour8'

