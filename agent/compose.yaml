services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    restart: unless-stopped
    networks:
      - agents
      - egress
    expose:
      - "3128"
    healthcheck:
      test: ["CMD-SHELL", "squidclient -h 127.0.0.1 -p 3128 mgr:info | grep -q 'Squid Object Cache'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  worker:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: Dockerfile.agent
    depends_on:
      proxy:
        condition: service_healthy
    networks:
      - agents
    environment:
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      ALL_PROXY: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1,proxy
      GIT_TERMINAL_PROMPT: "0"
    working_dir: /workspace
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    init: true
    stdin_open: true
    tty: true

networks:
  agents:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24

  egress:
    driver: bridge
